<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-panel">
      <div>
        <div class="login-panel__brand">NEXUS</div>
      </div>
      <div class="login-panel__tagline">
        Plataforma inteligente de gestão de processos e riscos —
        visibilidade, análise e ação em um só lugar.
      </div>
      <div class="login-panel__footnote">v0.1.0 · ambiente de desenvolvimento</div>
    </div>

    <div class="login-form-side">
      <form class="login-form" id="login-form">
        <h1>Entrar</h1>
        <p class="lead">Acesse com suas credenciais do NEXUS.</p>

        <div class="form-error" id="form-error"></div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">Entrar</button>
      </form>
    </div>
  </div>

  <script type="module" src="src/pages/login.js"></script>
</body>
</html>
