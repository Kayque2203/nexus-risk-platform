<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — Processos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav">
      <div class="app-nav__brand">NEXUS</div>
      <div class="app-nav__links">
        <a href="app.html" class="nav-link">Dashboard</a>
        <a href="processes.html" class="nav-link nav-link--active">Processos</a>
        <a href="risks.html" class="nav-link">Riscos</a>
      </div>
      <div class="app-nav__user">
        <span id="user-name">Carregando...</span>
        <span class="role" id="user-role"></span>
        <button class="btn-logout" id="logout-btn">Sair</button>
      </div>
    </nav>

    <main class="app-content" style="max-width: 960px;">
      <div class="toolbar">
        <div>
          <h1>Processos</h1>
          <p class="lead" style="margin-bottom:0;">Gerencie os processos monitorados pelo NEXUS.</p>
        </div>
        <button class="btn-secondary" id="new-process-btn">+ Novo processo</button>
      </div>

      <div class="form-panel" id="process-form-panel">
        <h2 id="form-title">Novo processo</h2>
        <form id="process-form">
          <input type="hidden" id="process-id" />
          <div class="form-grid">
            <div class="field field-full">
              <label for="p-name">Nome</label>
              <input type="text" id="p-name" required />
            </div>
            <div class="field field-full">
              <label for="p-description">Descrição</label>
              <textarea id="p-description"></textarea>
            </div>
            <div class="field">
              <label for="p-category">Categoria</label>
              <input type="text" id="p-category" />
            </div>
            <div class="field">
              <label for="p-department">Departamento</label>
              <input type="text" id="p-department" />
            </div>
            <div class="field">
              <label for="p-status">Status</label>
              <select id="p-status">
                <option value="aberto">Aberto</option>
                <option value="em_andamento">Em andamento</option>
                <option value="concluido">Concluído</option>
                <option value="atrasado">Atrasado</option>
                <option value="cancelado">Cancelado</option>
              </select>
            </div>
            <div class="field">
              <label for="p-priority">Prioridade</label>
              <select id="p-priority">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Média</option>
                <option value="alta">Alta</option>
                <option value="critica">Crítica</option>
              </select>
            </div>
            <div class="field field-full">
              <label for="p-due-date">Prazo</label>
              <input type="date" id="p-due-date" />
            </div>
          </div>
          <div class="form-error" id="process-form-error"></div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Salvar</button>
            <button type="button" class="btn-secondary" id="cancel-process-btn">Cancelar</button>
          </div>
        </form>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Departamento</th>
            <th>Status</th>
            <th>Prioridade</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="processes-table-body">
          <tr><td colspan="5" class="empty-state">Carregando...</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <script type="module" src="src/pages/processes.js"></script>
</body>
</html>
