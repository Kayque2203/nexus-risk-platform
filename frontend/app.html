<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — Painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <div class="app-shell-v2">
    <div id="sidebar-container"></div>

    <div class="main-area">
      <div class="top-bar">
        <div class="top-bar__greeting">
          Bem-vindo de volta, <strong id="greeting-name">...</strong>
        </div>
      </div>

      <main class="main-content">
        <h1>Painel</h1>
        <p class="lead">Visão geral de processos e riscos.</p>

        <div class="kpi-grid" id="stats-grid">
          <div class="empty-state">Carregando indicadores...</div>
        </div>

        <h2 class="section-title">Processos recentes</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Departamento</th>
              <th>Status</th>
              <th>Prioridade</th>
            </tr>
          </thead>
          <tbody id="processes-table-body">
            <tr><td colspan="4" class="empty-state">Carregando...</td></tr>
          </tbody>
        </table>

        <h2 class="section-title">Riscos recentes</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Severidade</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="risks-table-body">
            <tr><td colspan="4" class="empty-state">Carregando...</td></tr>
          </tbody>
        </table>
      </main>
    </div>
  </div>

  <script type="module" src="src/pages/app.js"></script>
</body>
</html>
