<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — Riscos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav">
      <div class="app-nav__brand">NEXUS</div>
      <div class="app-nav__links">
        <a href="app.html" class="nav-link">Dashboard</a>
        <a href="processes.html" class="nav-link">Processos</a>
        <a href="risks.html" class="nav-link nav-link--active">Riscos</a>
      </div>
      <div class="app-nav__user">
        <span id="user-name">Carregando...</span>
        <span class="role" id="user-role"></span>
        <button class="btn-logout" id="logout-btn">Sair</button>
      </div>
    </nav>

    <main class="app-content" style="max-width: 960px;">
      <div class="toolbar">
        <div>
          <h1>Riscos</h1>
          <p class="lead" style="margin-bottom:0;">Gerencie os riscos identificados nos processos.</p>
        </div>
        <button class="btn-secondary" id="new-risk-btn">+ Novo risco</button>
      </div>

      <div class="form-panel" id="risk-form-panel">
        <h2 id="form-title">Novo risco</h2>
        <form id="risk-form">
          <input type="hidden" id="risk-id" />
          <div class="form-grid">
            <div class="field field-full">
              <label for="r-process">Processo relacionado</label>
              <select id="r-process" required></select>
            </div>
            <div class="field field-full">
              <label for="r-description">Descrição</label>
              <textarea id="r-description" required></textarea>
            </div>
            <div class="field">
              <label for="r-category">Categoria</label>
              <input type="text" id="r-category" />
            </div>
            <div class="field">
              <label for="r-status">Status</label>
              <select id="r-status">
                <option value="aberto">Aberto</option>
                <option value="em_mitigacao">Em mitigação</option>
                <option value="mitigado">Mitigado</option>
                <option value="aceito">Aceito</option>
                <option value="cancelado">Cancelado</option>
              </select>
            </div>
            <div class="field">
              <label for="r-probability">Probabilidade</label>
              <select id="r-probability">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Média</option>
                <option value="alta">Alta</option>
                <option value="critica">Crítica</option>
              </select>
            </div>
            <div class="field">
              <label for="r-impact">Impacto</label>
              <select id="r-impact">
                <option value="baixa">Baixo</option>
                <option value="media" selected>Médio</option>
                <option value="alta">Alto</option>
                <option value="critica">Crítico</option>
              </select>
            </div>
            <div class="field field-full">
              <label for="r-priority">Prioridade</label>
              <select id="r-priority">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Média</option>
                <option value="alta">Alta</option>
                <option value="critica">Crítica</option>
              </select>
            </div>
          </div>
          <div class="form-error" id="risk-form-error"></div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Salvar</button>
            <button type="button" class="btn-secondary" id="cancel-risk-btn">Cancelar</button>
          </div>
        </form>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Categoria</th>
            <th>Severidade</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="risks-table-body">
          <tr><td colspan="5" class="empty-state">Carregando...</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <script type="module" src="src/pages/risks.js"></script>
</body>
</html>
